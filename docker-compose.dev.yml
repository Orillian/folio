# Development dependencies only (PostgreSQL, Redis, MinIO) on non-default
# local ports. The app itself runs from source: `npm run dev`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio
    ports:
      - "127.0.0.1:5490:5432"
    volumes:
      - folio-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # Transient data only: persistence is off on purpose.
    image: redis:7-alpine
    command: redis-server --save '' --appendonly no
    ports:
      - "127.0.0.1:6390:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: folio
      MINIO_ROOT_PASSWORD: folio-minio-dev
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9101"
    volumes:
      - folio-minio:/data

  # Single sign-on test provider, only with `docker compose --profile sso up -d keycloak`.
  # Realm "folio" (deploy/keycloak/folio-realm.json): client folio / folio-dev-secret, a `groups`
  # claim, users alice@acme.test (verified, engineering) and bob@acme.test (email NOT verified).
  # Point Folio at it (docs/AUTH.md):
  #   FOLIO_OIDC_KEYCLOAK_ISSUER=http://localhost:8085/realms/folio
  #   FOLIO_OIDC_KEYCLOAK_CLIENT_ID=folio
  #   FOLIO_OIDC_KEYCLOAK_CLIENT_SECRET=folio-dev-secret
  #   FOLIO_OIDC_KEYCLOAK_NAME=Keycloak
  #   FOLIO_OIDC_KEYCLOAK_DOMAINS=acme.test
  #   FOLIO_OIDC_KEYCLOAK_JIT=true
  # The same realm has a SAML 2.0 client, folio-saml (signed assertions, persistent NameID,
  # email / givenName / sn / groups attributes):
  #   FOLIO_SAML_KEYCLOAK_SAML_METADATA_URL=http://localhost:8085/realms/folio/protocol/saml/descriptor
  #   FOLIO_SAML_KEYCLOAK_SAML_SP_ENTITY_ID=folio-saml
  #   FOLIO_SAML_KEYCLOAK_SAML_NAME=Keycloak (SAML)
  #   FOLIO_SAML_KEYCLOAK_SAML_DOMAINS=acme.test
  #   FOLIO_SAML_KEYCLOAK_SAML_JIT=true
  # Admin console: http://localhost:8085/admin (admin / admin — local development only).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    profiles: [sso]
    command: start-dev --import-realm --http-port 8085
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - ./deploy/keycloak/folio-realm.json:/opt/keycloak/data/import/folio-realm.json:ro

volumes:
  folio-pg:
  folio-minio:
